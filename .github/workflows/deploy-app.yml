# Builds the Weekly Journal PWA and publishes it to GitHub Pages.
#
# One-time setup in the repo settings:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Optional (for cloud sync), under Settings -> Secrets and variables -> Actions -> Variables:
#   VITE_SUPABASE_URL       e.g. https://abcd1234.supabase.co
#   VITE_SUPABASE_ANON_KEY  the project's anon (public) key
name: Deploy Weekly Journal

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/deploy-app.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Creates the Pages site on first run if the token is allowed to; otherwise
      # enable it once under Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Served at https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
