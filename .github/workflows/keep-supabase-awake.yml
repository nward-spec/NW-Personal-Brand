# Supabase pauses a free project after a week without database traffic, which
# takes sign-in, sync and the Reminders bridge down together. A small query
# every six hours keeps it counted as active.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query the database through the REST API
        run: |
          set -e
          URL=$(grep '^VITE_SUPABASE_URL=' app/.env.production | cut -d= -f2-)
          KEY=$(grep '^VITE_SUPABASE_ANON_KEY=' app/.env.production | cut -d= -f2-)
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$URL/rest/v1/weeks?select=uid&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "status $code"
          test "$code" = "200"
