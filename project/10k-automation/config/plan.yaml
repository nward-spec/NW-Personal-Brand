# ---------------------------------------------------------------------------
# 10k PB block — 2XU Wellness Run, St Kilda, Sun 22 Nov 2026
#
# This file is DATA, not code. Hand-edit it when life intervenes; the engine
# reads it fresh every morning.
#
# The one number that matters most is paces.goal_pace.range. The parkrun time
# trial in week 4 recalibrates it, and every session written "@ goal_pace"
# (weeks 5-10) follows automatically. Nothing else needs touching.
# ---------------------------------------------------------------------------

meta:
  athlete: Nick
  timezone: Australia/Melbourne
  max_hr: 189
  lthr: 168
  race:
    name: "2XU Wellness Run 10k"
    location: "St Kilda foreshore"
    date: 2026-11-22
    distance_km: 10
    goal: "38:00"
  pb_10k: "38:19"

# Heart-rate zones, already set on the Forerunner 965.
# Easy running is governed by HR. Quality is governed by pace; HR is a readout.
zones:
  z1: { max: 134, label: "Recovery" }
  z2: { min: 135, max: 152, label: "Easy aerobic" }
  z3: { min: 153, max: 161, label: "Steady" }
  z4: { min: 162, max: 171, label: "Threshold" }
  z5: { min: 172, label: "VO2 / 5k" }

# ---------------------------------------------------------------------------
# Paces. Values are min:sec per kilometre.
#
# goal_pace is the anchor. Anything with `from: goal_pace` is recomputed from
# it, so a time-trial recalibration is a one-line edit here.
# Absolute `range:` entries are deliberately NOT tied to goal pace — they are
# aerobic paces that should not move when 10k fitness does.
# ---------------------------------------------------------------------------
paces:
  goal_pace:
    range: "3:46-3:50"
    note: >-
      38:00 is 3:48/km, so the band brackets it. Set from six weeks of Whoop
      workout history on 22 Oct: 36 km a week on average over five complete
      weeks, range 26-52, longest run 18.5 km. The previous 3:40-3:45 was a
      37:00 target written before any of that was known. Everything below
      derives from this line.
  five_k:
    from: goal_pace
    offset_fast: -5
    offset_slow: -5
  threshold:
    from: goal_pace
    offset_fast: 20
    offset_slow: 23
    note: "Conservative band. Weeks 1-5 and any diagnostic session use this."
  threshold_sharp:
    from: goal_pace
    offset_fast: 15
    offset_slow: 20
    note: >-
      The Friday key session from week 6. At a 3:40-3:45 goal that is
      3:55-4:05. The wider `threshold` band above sits closer to marathon
      effort than to threshold for a sub-38 runner, which is fine for base
      weeks and too soft for the key session of a race block.
  vo2:
    from: goal_pace
    offset_fast: -10
    offset_slow: -10
    note: "3k effort. Short sharpeners only - nothing longer than 1min sits here."
  strides:
    from: goal_pace
    offset_fast: -25
    width: 0                  # a single pace, not a band, whatever goal pace does
  progression:
    from: goal_pace
    offset_fast: 25
    offset_slow: 30
    note: "Long-run finish: 4:15 drifting to 4:05 at current goal pace."
  steady:
    range: "4:25-4:35"
  easy:
    range: "5:00-5:30"
    note: "Expectation, not a target. Never written onto a session."
  recovery:
    range: "5:20-5:50"

# ---------------------------------------------------------------------------
# Structural rules. The engine will not violate these.
# ---------------------------------------------------------------------------
rules:
  # Friday is a gym day in weeks 1-5 and the key-session day from week 6.
  # Listing it here is safe either way: the allocator reads each day's kind
  # from the template, so a Friday whose kind is `gym` is simply skipped.
  # Monday is a gym day in weeks 1-6 and an easy run plus gym from week 7.
  # A weekday listed here is only allocated volume when its kind is easy or
  # structural, so a Monday whose kind is `gym` is still skipped.
  run_days: [mon, tue, wed, thu, fri, sat, sun]
  double_min_km: 5.0          # no run shorter than this, ever
  double_threshold_km: 12.0   # single run until the day needs more than this
  double_days: [tue, thu, sat] # never Wednesday (run club), never Sunday (long run)
  long_run_cap_km: 20.0
  max_easy_day_km: 24.0       # ceiling for a single easy day, doubles included
  round_to_km: 0.5

defaults:
  quality_warmup_km: 3.0
  quality_cooldown_km: 2.0
  strides: { count: 4, seconds: 20 }
  recovery_jog_pace: recovery
  gym:
    mon: "Lower body"
    fri: "Upper + core"
  # Run club cannot be prescribed: written as a duration placeholder only.
  run_club:
    estimate_km: 10.0
    note: "Run club — their session. Placeholder only, reconciled Thursday."

# Mon-Sun shape of every week. Overridden per-week by `days:` below.
week_template:
  mon: { kind: gym }
  tue: { kind: easy, strides: true }
  wed: { kind: run_club }
  thu: { kind: easy }
  fri: { kind: gym }
  sat: { kind: quality }
  sun: { kind: long_run }

# ---------------------------------------------------------------------------
# The block. Weeks run Mon-Sun.
#
# Quality volume by week: 32min, 36min, 36min, TT, 6km, 7.5km, 8km, 6km, 6km.
# It builds, peaks at W7, and steps down without losing rep length.
#
# The limiter is long reps, not speed. Almost nothing under 1km after week 4.
# ---------------------------------------------------------------------------
weeks:
  - number: 1



    start: 2026-09-14
    volume_km: 58
    quality:
      kind: intervals
      name: "4 x 8min threshold"
      reps: 4
      rep: { minutes: 8 }
      recovery: { seconds: 90 }
      pace: threshold
    long_run: { km: 14 }

  - number: 2



    start: 2026-09-21
    volume_km: 65
    quality:
      kind: intervals
      name: "3 x 12min threshold"
      reps: 3
      rep: { minutes: 12 }
      recovery: { seconds: 120 }
      pace: threshold
    long_run: { km: 16 }

  - number: 3



    start: 2026-09-28
    volume_km: 72
    quality:
      kind: intervals
      name: "2 x 18min threshold"
      reps: 2
      rep: { minutes: 18 }
      recovery: { seconds: 180 }
      pace: threshold
    long_run: { km: 18, progression_km: 4 }

  - number: 4



    start: 2026-10-05
    volume_km: 62
    note: "Down week. AEDT starts 4 Oct. parkrun time trial recalibrates goal pace."
    quality:
      kind: time_trial
      name: "parkrun 5k TIME TRIAL"
      distance_km: 5.0
      pace: five_k
    long_run: { km: 16 }

  - number: 5



    start: 2026-10-12
    # 73, not 80: Thursday's PM recovery run went to basketball. This records
    # the week as it was actually run rather than leaving the allocator to
    # push the difference onto a Tuesday that has already happened.
    volume_km: 73
    note: >-
      Transition week. Wednesday 14 Oct was run as 6 x 2min @ 3:45 off 45s
      standing, so Saturday carries the long-interval work instead of the
      planned 4 x 1500m. The two-session structure starts properly in week 6.
    quality:
      kind: intervals
      name: "4 x 1500m @ GP"
      reps: 4
      rep: { km: 1.5 }
      recovery: { seconds: 120 }
      pace: goal_pace
    long_run: { km: 18 }
    days:
      thu:
        kind: easy
        km: 12.0
        note: >-
          15 Oct: the 7km PM recovery run was dropped for basketball. Thursday
          night basketball is a standing commitment from here.
      sat:
        kind: quality
        quality:
          kind: intervals
          name: "4 x 8min threshold"
          reps: 4
          rep: { minutes: 8 }
          recovery: { seconds: 90 }
          pace: threshold
          note: >-
            DIAGNOSTIC. Deliberately on the conservative `threshold` band, not
            the sharper one used from week 6. Controlled and repeatable means
            the engine is intact and 14 Oct was just a punishing session
            design. Straining by rep 2 means the 37:00 goal needs revisiting.

  # -------------------------------------------------------------------------
  # Weeks 6-10: two key sessions a week, Tuesday and Friday.
  #
  #   Tuesday  - VO2 / speed. 5k-pace reps early, goal-pace reps late, as
  #              specificity rises towards the race.
  #   Friday   - THE key session. Long threshold intervals.
  #   Sunday   - long run, easy throughout. Never a third hard day.
  #
  # Run club is dropped from week 6. Volume holds near 80 km in singles
  # rather than climbing to 90 in doubles: with 5 weeks left, intensity
  # still converts to fitness and extra kilometres mostly do not.
  #
  # Gym moves off Friday, which is now the key session. Monday keeps a
  # run-free upper-body slot; lower body stacks onto Wednesday's easy run so
  # it sits two clear days either side of a hard day.
  # -------------------------------------------------------------------------
  - number: 6



    start: 2026-10-19
    volume_km: 70
    note: >-
      First week of the two-session structure. Run club dropped. Cut from 80
      to 70 km on 22 Oct, with Wednesday pinned to what was already run and
      the weekend brought down: 14.5 + 20 km across Sat and Sun was more
      than a typical whole week, and 20 km was above the 18.5 km maximum of
      the previous six weeks.
    long_run: { km: 16 }
    days:
      mon: { kind: gym, focus: "Upper + core" }
      tue:
        kind: quality
        quality:
          kind: intervals
          name: "6 x 3min VO2"
          reps: 6
          rep: { minutes: 3 }
          recovery: { seconds: 120 }
          pace: five_k
          note: "3min at 5k effort is the classic VO2 rep. Jog the recoveries."
      wed: { kind: easy, km: 14.5, strides: true, gym: "Lower body" }
      thu:
        kind: easy
        km: 6.0
        note: >-
          BASKETBALL tonight. Capped at 6km, Z1, morning only. Friday is
          the key session and this is the day before it, so the volume
          this day would have carried sits on Wednesday and Saturday.
      fri:
        kind: quality
        quality:
          kind: intervals
          name: "3 x 10min threshold"
          reps: 3
          rep: { minutes: 10 }
          recovery: { seconds: 120 }
          pace: threshold_sharp
          keystone: true
          keystone_note: "KEY SESSION. 30min of threshold work. This is the week."
      sat: { kind: easy, km: 8.0 }
      sun: { kind: long_run }

  - number: 7



    start: 2026-10-26
    volume_km: 55
    note: "Longest reps of the block. Friday is the keystone."
    keystone: true
    long_run: { km: 16 }
    days:
      mon: { kind: easy, gym: "Lower body" }
      tue:
        kind: quality
        quality:
          kind: intervals
          name: "5 x 4min VO2"
          reps: 5
          rep: { minutes: 4 }
          recovery: { seconds: 150 }
          pace: five_k
      wed: { kind: easy, strides: true }
      thu:
        kind: rest
        gym: "Upper + core"
        note: >-
          BASKETBALL. Thursday is the rest day from running: basketball is
          the session, and Friday's key work needs the legs. Whoop has it at
          55-79 minutes and strain 15-16, which is a real training load, not
          a gap in the week.
      fri:
        kind: quality
        quality:
          kind: intervals
          name: "2 x 15min threshold"
          reps: 2
          rep: { minutes: 15 }
          recovery: { seconds: 180 }
          pace: threshold_sharp
          keystone: true
          keystone_note: >-
            KEYSTONE. 30min of threshold in two blocks. Hold the band through
            the second rep and the race is there. Fading badly in rep 2 is the
            honest signal to revise the goal, not to try harder next week.
      sat:
        kind: rest
        note: "Rest. The week's volume sits on Mon, Tue, Wed, Fri and Sun."
      sun: { kind: long_run }

  - number: 8



    start: 2026-11-02
    volume_km: 55
    note: "Specificity rises: Tuesday moves to goal-pace reps."
    long_run: { km: 16 }
    days:
      mon: { kind: easy, gym: "Lower body" }
      tue:
        kind: quality
        quality:
          kind: intervals
          name: "4 x 2km @ GP"
          reps: 4
          rep: { km: 2.0 }
          recovery: { seconds: 120 }
          pace: goal_pace
          note: "8km at goal pace. The race rehearsal, broken into four."
      wed: { kind: easy, strides: true }
      thu:
        kind: rest
        gym: "Upper + core"
        note: >-
          BASKETBALL. Thursday is the rest day from running: basketball is
          the session, and Friday's key work needs the legs. Whoop has it at
          55-79 minutes and strain 15-16, which is a real training load, not
          a gap in the week.
      fri:
        kind: quality
        quality:
          kind: intervals
          name: "4 x 8min threshold"
          reps: 4
          rep: { minutes: 8 }
          recovery: { seconds: 90 }
          pace: threshold_sharp
          keystone: true
          keystone_note: "KEY SESSION. 32min of threshold off short recoveries."
      sat:
        kind: rest
        note: "Rest. The week's volume sits on Mon, Tue, Wed, Fri and Sun."
      sun: { kind: long_run }

  - number: 9



    start: 2026-11-09
    volume_km: 45
    note: "Taper begins. Intensity stays, volume comes down."
    long_run: { km: 14 }
    days:
      mon: { kind: easy, gym: "Lower body" }
      tue:
        kind: quality
        quality:
          kind: intervals
          name: "3 x 2km @ GP"
          reps: 3
          rep: { km: 2.0 }
          recovery: { seconds: 120 }
          pace: goal_pace
      wed: { kind: easy, strides: true }
      thu:
        kind: rest
        gym: "Upper + core"
        note: >-
          BASKETBALL. Thursday is the rest day from running: basketball is
          the session, and Friday's key work needs the legs. Whoop has it at
          55-79 minutes and strain 15-16, which is a real training load, not
          a gap in the week.
      fri:
        kind: quality
        quality:
          kind: intervals
          name: "2 x 10min threshold"
          reps: 2
          rep: { minutes: 10 }
          recovery: { seconds: 120 }
          pace: threshold_sharp
          note: "Last threshold session. Cut back, not cut out. Do not add reps."
      sat:
        kind: rest
        note: "Rest. The week's volume sits on Mon, Tue, Wed, Fri and Sun."
      sun: { kind: long_run }

  - number: 10



    start: 2026-11-16
    volume_km: 36
    race_week: true
    note: "Race week. Taper reliably produces poor recovery scores - AMBER is ignored."
    # Race week is prescribed day by day. The volume allocator does not run.
    days:
      mon: { kind: gym, focus: "Upper + core" }
      tue:
        kind: quality
        quality:
          kind: intervals
          name: "6 x 1min sharpener"
          reps: 6
          rep: { minutes: 1 }
          recovery: { seconds: 90 }
          pace: five_k
          note: >-
            Sharpener, not a session. Six minutes of work total. The point is
            to remind the legs what fast feels like, five days out.
      wed: { kind: easy, km: 6.0, note: "Run club dropped from week 6 onward." }
      thu:
        kind: easy
        km: 6.0
        note: "BASKETBALL: three days before the race. Decide in advance."
      fri: { kind: rest, note: "No gym this week." }
      sat:
        kind: shakeout
        minutes: 15
        strides: true
        name: "15min easy + 4 x 20s strides"
      sun:
        kind: race
        name: "2XU Wellness Run 10k"
        warmup_km: 3.0
        strides: true
        note: >-
          8:40am gun, RED wave ("under 45 mins", under 4:30/km) - the first
          wave off. Green 8:42, Yellow 8:45, Blue 8:48. Start and finish at
          Catani Gardens, St Kilda; bag drop from 5:30am; cut-off 2hr 30min.
          Confirmed from wellnessrun.com.au/melbourne-10k-run on 22 Oct 2026.
          First 2km at 3:50, settle to 3:47 through 8km, empty from there.
          38:00 is 3:48 average, so going out at 3:42 buys nothing and costs
          the last 3km.
          Exposed foreshore: if there is a headwind on an out-and-back leg,
          sit in and do not fight it.
